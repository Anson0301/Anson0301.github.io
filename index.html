<script>
const reduce=matchMedia('(prefers-reduced-motion: reduce)'),timers=[];
if('scrollRestoration' in history)history.scrollRestoration='manual';
function isLoading(){return document.documentElement.classList.contains('intro-loading');}
function lockIntro(){document.documentElement.classList.add('intro-loading');window.scrollTo({top:0,behavior:'instant'});}
function finishIntro(){document.body.classList.add('comics-visible');document.documentElement.classList.remove('intro-loading');}
window.addEventListener('touchmove',event=>{if(isLoading())event.preventDefault();},{passive:false});
window.addEventListener('keydown',event=>{if(isLoading()&&['ArrowDown','ArrowUp','PageDown','PageUp','Home','End',' '].includes(event.key)&&!event.target.closest('input,textarea,[contenteditable=true]'))event.preventDefault();});
document.addEventListener('click',event=>{if(isLoading()&&event.target.closest('a[href^="#"]'))event.preventDefault();},true);

function route(){if(isLoading()){history.replaceState(null,'','#home');document.getElementById('home').hidden=false;window.scrollTo({top:0,behavior:'instant'});return;}const key=location.hash.slice(1);document.getElementById('home').hidden=false;document.querySelectorAll('nav a').forEach(a=>{if(a.hash==='#'+key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});requestAnimationFrame(()=>{const target=key==='about'?document.getElementById('comic'):key==='work'?document.getElementById('work'):key==='contact'?document.getElementById('contact'):document.getElementById('hero');target.scrollIntoView({behavior:reduce.matches?'instant':'smooth'});});}
function play(){lockIntro();timers.forEach(clearTimeout);timers.length=0;document.body.classList.remove('ink','docked','revealed','comics-visible','intro-skipped');history.replaceState(null,'','#home');route();void document.body.offsetWidth;if(reduce.matches){document.body.classList.add('ink','docked','revealed');finishIntro();return;}requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('ink')));timers.push(setTimeout(()=>document.body.classList.add('docked'),2250),setTimeout(()=>document.body.classList.add('revealed'),3450));}
const sectionParts=[document.getElementById('hero'),document.getElementById('comic'),document.getElementById('work'),document.getElementById('contact')];let sectionGesture=false,sectionGestureTimer=0,sectionBusyUntil=0;
function nearestPartIndex(y,positions){let best=0;for(let i=1;i<positions.length;i++)if(Math.abs(positions[i]-y)<Math.abs(positions[best]-y))best=i;return best;}
function releaseSectionGesture(){clearTimeout(sectionGestureTimer);const remaining=sectionBusyUntil-performance.now();sectionGestureTimer=setTimeout(()=>{sectionGesture=false;},Math.max(190,remaining+20));}
function completeCurrentWriting(){if(isLoading()&&!document.body.classList.contains('revealed'))return true;if(isLoading()){timers.forEach(clearTimeout);timers.length=0;document.body.classList.add('ink','docked','revealed','intro-skipped');finishIntro();return true;}const positions=sectionParts.map(part=>window.scrollY+part.getBoundingClientRect().top);const current=sectionParts[nearestPartIndex(window.scrollY,positions)];if(current.id==='work'&&!portfolioBoard.classList.contains('portfolio-ready')){portfolioBoard.classList.add('journey-entered','portfolio-writing-skipped');revealPortfolio();return true;}if(current.id==='contact'&&!contactSection.classList.contains('contact-written')){contactSection.classList.add('contact-in-view','writing-completed','contact-written');contactDetails.inert=false;return true;}return false;}
window.addEventListener('wheel',event=>{if(event.ctrlKey||Math.abs(event.deltaX)>Math.abs(event.deltaY))return;if(document.getElementById('home').hidden||Math.abs(event.deltaY)<2)return;event.preventDefault();if(sectionGesture){releaseSectionGesture();return;}if(completeCurrentWriting()){sectionGesture=true;sectionBusyUntil=performance.now()+650;releaseSectionGesture();return;}const positions=sectionParts.map(part=>window.scrollY+part.getBoundingClientRect().top),index=nearestPartIndex(window.scrollY,positions),next=Math.max(0,Math.min(sectionParts.length-1,index+(event.deltaY>0?1:-1)));sectionGesture=true;sectionBusyUntil=performance.now()+(reduce.matches?200:650);releaseSectionGesture();if(next===index)return;sectionParts[next].scrollIntoView({behavior:reduce.matches?'instant':'smooth',block:'start'});const hashes=['home','about','work','contact'];history.replaceState(null,'','#'+hashes[next]);document.querySelectorAll('nav a').forEach(link=>{if(link.hash==='#'+hashes[next])link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');});},{passive:false});

const captionCards=[...document.querySelectorAll('.scatter-card')];
function fitPhotoCards(){if(window.matchMedia('(max-width:600px)').matches)return;const scene=document.querySelector('.scatter-scene');if(document.getElementById('home').hidden||!scene||!scene.clientWidth)return;const box=scene.getBoundingClientRect();captionCards.forEach(card=>{card.style.setProperty('--edge-x','0px');card.style.setProperty('--edge-y','0px');const b=card.getBoundingClientRect(),pad=14;const minY=box.top+Math.min(130,box.height*.18);let dx=0,dy=0;if(b.left<box.left+pad)dx=box.left+pad-b.left;else if(b.right>box.right-pad)dx=box.right-pad-b.right;if(b.top<minY)dy=minY-b.top;else if(b.bottom>box.bottom-pad)dy=box.bottom-pad-b.bottom;card.style.setProperty('--edge-x',dx.toFixed(2)+'px');card.style.setProperty('--edge-y',dy.toFixed(2)+'px');});}
captionCards.forEach(card=>{const toggle=()=>{const on=!card.classList.contains('is-active');captionCards.forEach(el=>{el.classList.remove('is-active');el.setAttribute('aria-pressed','false');});if(on){card.classList.add('is-active');card.setAttribute('aria-pressed','true');}};card.addEventListener('click',()=>{if(matchMedia('(hover: none)').matches)toggle();});card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle();}if(event.key==='Escape'){card.classList.remove('is-active');card.setAttribute('aria-pressed','false');}});});

function bubblePath(points,softness=1){const around=(p,q)=>[p[0]+(q[0]-p[0])*softness*.5,p[1]+(q[1]-p[1])*softness*.5],str=p=>p.map(n=>n.toFixed(2)).join(' ');let d='';for(let i=0;i<points.length;i++){const p=points[i],prev=points[(i+points.length-1)%points.length],next=points[(i+1)%points.length],entry=around(p,prev),exit=around(p,next);d+=(i?' L':'M')+str(entry)+' Q'+str(p)+' '+str(exit);}return d+' Z';}
for(const key of Object.keys(portfolioReferenceContours)){const count=128;portfolioReferenceContours[key]=Array.from({length:count},(_,i)=>{const a=-Math.PI/2+i*Math.PI*2/count,r=.455+.025*Math.cos(10*a);return [Math.cos(a)*r,Math.sin(a)*r];});const sizes={c:[240,200],mountain:[400,330],lizard:[430,340],clock:[400,300],car:[440,300]},[w,h]=sizes[key];document.querySelector('#reference-hide-'+key+' .portfolio-rest-bubble > path').setAttribute('d',bubblePath(bubblePoints('cloud-'+key,0,w,h)));}
function coverDimensions(card){const board=portfolioBoard.getBoundingClientRect(),ratio=Number(card.dataset.coverRatio)||16/9,pad=10,key=card.dataset.project;if(matchMedia('(max-width:600px)').matches){const rest=card.getBoundingClientRect(),width=Math.min(board.width*.9,Math.max(rest.width,board.width*.72)),height=(width-32)/ratio+32;return {width,height,cx:Math.max(board.left+width/2,Math.min(board.right-width/2,rest.left+rest.width/2)),cy:Math.max(board.top+height/2,Math.min(board.top+board.height*.62-height/2,rest.top+rest.height/2))};}let width,cx,cy;if(key==='c'){const availableHeight=Math.max(40,board.height*.25-pad*2);width=Math.min(490,board.width*.42,Math.max(1,(availableHeight-32)*ratio+32));cx=board.left+board.width*.58;cy=board.top+pad+((width-32)/ratio+32)/2;}else{const left=key==='lizard'||key==='car',zoneLeft=left?board.left+pad:board.left+board.width*.72,zoneRight=left?board.left+board.width*.29:board.right-pad;width=Math.max(1,Math.min(490,zoneRight-zoneLeft));cx=(zoneLeft+zoneRight)/2;const rest=card.getBoundingClientRect();cy=rest.top+rest.height/2;}const height=Math.max(1,(width-32)/ratio+32);cy=Math.max(96+height/2,Math.min(innerHeight-14-height/2,cy));return {width,height,cx,cy};}
function paintBubble(card,amount){const state=bubbleStates.get(card),rest=card.getBoundingClientRect(),goal=coverDimensions(card),width=rest.width+(goal.width-rest.width)*amount,height=rest.height+(goal.height-rest.height)*amount;state.surface.style.visibility=amount>.0001?'visible':'hidden';document.getElementById('reference-hide-'+card.dataset.project).style.opacity=amount>.0001?'0':'1';state.surface.style.width=width+'px';state.surface.style.height=height+'px';state.surface.setAttribute('viewBox','0 0 '+width+' '+height);const cx=rest.left+rest.width/2,cy=rest.top+rest.height/2,dx=(goal.cx-cx)*amount,dy=(goal.cy-cy)*amount;state.surface.style.left='calc(50% + '+dx+'px)';state.surface.style.top='calc(50% + '+dy+'px)';const d=bubblePath(bubblePoints(card.dataset.shape,amount,width,height),1);state.outline.setAttribute('d',d);state.clip.setAttribute('d',d);const iconInset=card.dataset.project==='c'?.10:card.dataset.project==='clock'?.17:card.dataset.project==='lizard'?.17:.075;state.icon.setAttribute('x',width*iconInset);state.icon.setAttribute('y',height*iconInset);state.icon.setAttribute('width',width*(1-2*iconInset));state.icon.setAttribute('height',height*(1-2*iconInset));state.icon.style.opacity=String(Math.max(0,1-amount*2.5));state.cover.setAttribute('x',16);state.cover.setAttribute('y',16);state.cover.setAttribute('width',Math.max(1,width-32));state.cover.setAttribute('height',Math.max(1,height-32));state.cover.style.opacity=String(Math.max(0,Math.min(1,(amount-.2)/.65)));}
function animateBubble(card,open){const state=bubbleStates.get(card);cancelAnimationFrame(state.raf);const from=state.value,to=open?1:0,start=performance.now(),duration=reduce.matches?0:480*Math.abs(to-from);card.classList.add('is-morphing');const tick=now=>{const t=duration?Math.min(1,(now-start)/duration):1,eased=t*t*(3-2*t);state.value=from+(to-from)*eased;paintBubble(card,state.value);if(t<1)state.raf=requestAnimationFrame(tick);else{card.classList.remove('is-morphing');state.raf=0;}};state.raf=requestAnimationFrame(tick);}
function setPortfolioPreview(card,open){const state=bubbleStates.get(card);if(!state||state.open===open)return;if(open)portfolioCards.forEach(other=>{if(other!==card)setPortfolioPreview(other,false);});state.open=open;card.classList.toggle('is-preview',open);card.setAttribute('aria-expanded',String(open));animateBubble(card,open);}
portfolioCards.forEach(card=>{const surface=card.querySelector('.bubble-morph-surface');bubbleStates.set(card,{surface,outline:surface.querySelector('.bubble-shape'),clip:surface.querySelector('.bubble-clip-path'),icon:surface.querySelector('.bubble-drawing'),cover:surface.querySelector('.bubble-project-cover'),value:0,open:false,raf:0});paintBubble(card,0);card.addEventListener('pointerenter',event=>{if(event.pointerType!=='touch')setPortfolioPreview(card,true);});card.addEventListener('pointerleave',()=>{if(!card.matches(':focus-visible'))setPortfolioPreview(card,false);});card.addEventListener('focus',()=>{if(!matchMedia('(hover: none)').matches)setPortfolioPreview(card,true);});card.addEventListener('blur',()=>setPortfolioPreview(card,false));card.addEventListener('click',event=>{if(matchMedia('(hover: none)').matches&&!bubbleStates.get(card).open){event.preventDefault();setPortfolioPreview(card,true);}});card.addEventListener('keydown',event=>{if(event.key==='Escape'){setPortfolioPreview(card,false);card.blur();}});});

const mobilePortfolioArt=portfolioBoard.querySelector('.portfolio-reference-art');const mobileArtOriginal=mobilePortfolioArt.innerHTML;function arrangeMobilePortfolio(){mobilePortfolioArt.innerHTML=mobileArtOriginal;if(!matchMedia('(max-width:600px)').matches){mobilePortfolioArt.setAttribute('viewBox','0 0 1671 941');return;}mobilePortfolioArt.setAttribute('viewBox','0 0 900 1500');mobilePortfolioArt.setAttribute('preserveAspectRatio','none');const placements={lizard:[15,0,410,324,430],c:[490,0,340,283,240],mountain:[15,360,410,338,400],car:[480,370,405,276,440],clock:[20,750,380,285,400]};for(const [key,[x,y,w,h,originalW]]of Object.entries(placements)){document.getElementById('reference-hide-'+key).setAttribute('transform','translate('+x+' '+y+') scale('+(w/originalW)+')');const card=portfolioCards.find(c=>c.dataset.project===key);for(const [prop,v]of Object.entries({'left':x/9,'top':y/15,'width':w/9,'height':h/15}))card.style.setProperty('--mobile-'+prop,v+'%');}const mobileDots={lizard:[[345,345,10],[367,369,6]],c:[[76,218,7],[62,237,4.3]],mountain:[[330,341,10],[351,365,6]],car:[[135,311,11],[112,337,7],[94,358,4.5]],clock:[[80,312,10],[99,337,6]]};for(const [key,dots]of Object.entries(mobileDots)){const g=document.querySelector('#reference-hide-'+key+' .portfolio-thought-connectors');g.innerHTML=dots.map(([x,y,r])=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="white" stroke="#111" stroke-width="3"/>').join('');}const person=mobilePortfolioArt.querySelector('.portfolio-transparent-person');for(const [k,v]of Object.entries({x:150,y:930,width:650,height:642}))person.setAttribute(k,v);const note=mobilePortfolioArt.querySelector('.portfolio-thinking-note');note.setAttribute('href','assets/portfolio-thinking-note-mobile-v4.svg');for(const [k,v]of Object.entries({x:550,y:790,width:310,height:192}))note.setAttribute(k,v);}arrangeMobilePortfolio();window.addEventListener('resize',arrangeMobilePortfolio);document.addEventListener('click',event=>{if(!matchMedia('(pointer:coarse)').matches||event.target.closest('a,button,input,textarea'))return;if(completeCurrentWriting()){event.preventDefault();}},{capture:true});
const contactSection=document.getElementById('contact');const contactDetails=contactSection.querySelector('.contact-details');contactDetails.inert=true;contactSection.querySelector('.contact-writing-last').addEventListener('animationend',event=>{if(event.animationName==='contact-write'){contactSection.classList.add('contact-written');contactDetails.inert=false;}});const contactObserver=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){const copy=entry.target.querySelector('.contact-copy');copy.style.transform='none';const b=copy.getBoundingClientRect(),parent=entry.target.getBoundingClientRect();copy.style.setProperty('--contact-center-offset',((parent.left+parent.width/2)-(b.left+b.width/2))+'px');copy.style.removeProperty('transform');}entry.target.classList.toggle('contact-in-view',entry.isIntersecting);if(!entry.isIntersecting){entry.target.classList.remove('contact-written','writing-completed');contactDetails.inert=true;}else if(reduce.matches){entry.target.classList.add('contact-written');contactDetails.inert=false;}}},{threshold:.22});contactObserver.observe(contactSection);
